<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion des annonces — The Lost MC</title>
<link rel="stylesheet" href="../../css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app"></div>
<script src="../../js/config.js"></script>
<script src="../../js/supabase-client.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/layout.js"></script>
<script>
(async () => {
  const result = await LostMCAuth.guardPage(["table"]);
  if (!result) return;
  LostMCLayout_render("table-annonces", "Annonces — Gestion");

  const content = document.getElementById("content");
  content.innerHTML = `
    <div class="panel">
      <div class="panel-title"><h2>Nouvelle annonce</h2></div>
      <form id="form">
        <label>Titre</label><input id="title" required>
        <label>Contenu</label><textarea id="body" rows="4" required></textarea>
        <label><input type="checkbox" id="pinned" style="width:auto; display:inline-block; margin-right:6px"> Épingler</label>
        <div class="form-actions"><button class="btn-primary" type="submit">Publier</button></div>
      </form>
    </div>
    <div class="panel"><div class="panel-title"><h2>Toutes les annonces</h2></div><div id="list"><div class="empty">Chargement…</div></div></div>
  `;

  async function load() {
    const { data } = await sb.from("announcements").select("*").order("pinned", { ascending: false }).order("created_at", { ascending: false });
    const el = document.getElementById("list");
    if (!data || !data.length) { el.innerHTML = `<div class="empty">Aucune annonce.</div>`; return; }
    el.innerHTML = data.map(a => `
      <div class="item-row">
        <div>
          <div class="t">${a.title} ${a.pinned ? '<span class="tag pinned">Épinglé</span>' : ''} <span class="tag">${a.source}</span></div>
          <div class="d" style="white-space:pre-wrap">${a.content}</div>
          <div class="d">${a.author_name || ''} · ${new Date(a.created_at).toLocaleString('fr-FR')}</div>
        </div>
        <button class="btn-sm btn-danger" data-id="${a.id}" data-msgid="${a.discord_message_id || ''}">Suppr.</button>
      </div>`).join("");
    el.querySelectorAll("button[data-id]").forEach(b => b.onclick = async () => {
      if (!confirm("Supprimer cette annonce ?")) return;
      if (b.dataset.msgid) {
        await sb.from("discord_delete_queue").insert({ discord_message_id: b.dataset.msgid });
      }
      await sb.from("announcements").delete().eq("id", b.dataset.id);
    });
  }
  load();

  document.getElementById("form").onsubmit = async (e) => {
    e.preventDefault();
    const { error } = await sb.from("announcements").insert({
      title: document.getElementById("title").value,
      content: document.getElementById("body").value,
      pinned: document.getElementById("pinned").checked,
      source: "site",
      author_id: LostMCAuth.profile.id, author_name: LostMCAuth.profile.username,
    });
    if (error) { alert(error.message); return; }
    e.target.reset();
  };

  sb.channel("annadmin-realtime").on("postgres_changes", { event: "*", schema: "public", table: "announcements" }, load).subscribe();
})();
</script>
</body>
</html>
