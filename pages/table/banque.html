<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banque du MC — The Lost MC</title>
<link rel="stylesheet" href="../../css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app"></div>
<script src="../../js/config.js"></script>
<script src="../../js/supabase-client.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/layout.js"></script>
<script>
(async () => {
  const result = await LostMCAuth.guardPage(["table"]);
  if (!result) return;
  LostMCLayout_render("banque", "Banque du MC");

  const content = document.getElementById("content");
  content.innerHTML = `
    <div class="grid-3">
      <div class="panel stat-box"><div class="lbl">Solde actuel</div><div class="num" id="balance">—</div></div>
      <div class="panel stat-box"><div class="lbl">Total entrées</div><div class="num pos" id="totalIn">—</div></div>
      <div class="panel stat-box"><div class="lbl">Total sorties</div><div class="num neg" id="totalOut">—</div></div>
    </div>
    <div class="panel">
      <div class="panel-title"><h2>Nouveau mouvement</h2></div>
      <form id="form">
        <div class="form-row">
          <div><label>Type</label><select id="type"><option value="entree">Entrée</option><option value="sortie">Sortie</option></select></div>
          <div><label>Montant</label><input id="amount" type="number" min="0.01" step="0.01" required></div>
        </div>
        <label>Raison</label><input id="reason" required>
        <div class="form-actions"><button class="btn-primary" type="submit">Enregistrer</button></div>
      </form>
    </div>
    <div class="panel"><div class="panel-title"><h2>Historique</h2></div><div id="list"><div class="empty">Chargement…</div></div></div>
  `;

  async function load() {
    const { data } = await sb.from("bank_transactions").select("*").order("created_at", { ascending: false });
    const el = document.getElementById("list");
    let totalIn = 0, totalOut = 0;
    (data || []).forEach(t => t.type === "entree" ? totalIn += Number(t.amount) : totalOut += Number(t.amount));
    document.getElementById("totalIn").textContent = totalIn.toLocaleString('fr-FR');
    document.getElementById("totalOut").textContent = totalOut.toLocaleString('fr-FR');
    document.getElementById("balance").textContent = (totalIn - totalOut).toLocaleString('fr-FR');

    if (!data || !data.length) { el.innerHTML = `<div class="empty">Aucun mouvement.</div>`; return; }
    el.innerHTML = data.map(t => `
      <div class="item-row">
        <div>
          <div class="t"><span class="tag ${t.type==='entree'?'in':'out'}">${t.type==='entree'?'Entrée':'Sortie'}</span> ${Number(t.amount).toLocaleString('fr-FR')}</div>
          <div class="d">${t.reason}</div>
          <div class="d">${t.author_name || ''} · ${new Date(t.created_at).toLocaleString('fr-FR')}</div>
        </div>
      </div>`).join("");
  }
  load();

  document.getElementById("form").onsubmit = async (e) => {
    e.preventDefault();
    const { error } = await sb.from("bank_transactions").insert({
      type: document.getElementById("type").value,
      amount: parseFloat(document.getElementById("amount").value),
      reason: document.getElementById("reason").value,
      author_id: LostMCAuth.profile.id, author_name: LostMCAuth.profile.username,
    });
    if (error) { alert(error.message); return; }
    e.target.reset();
  };

  sb.channel("bank-realtime").on("postgres_changes", { event: "*", schema: "public", table: "bank_transactions" }, load).subscribe();
})();
</script>
</body>
</html>
