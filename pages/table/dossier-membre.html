<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dossier membre — The Lost MC</title>
<link rel="stylesheet" href="../../css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app"></div>
<script src="../../js/config.js"></script>
<script src="../../js/supabase-client.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/layout.js"></script>
<script>
(async () => {
  const result = await LostMCAuth.guardPage(["recruteur"]);
  if (!result) return;
  LostMCLayout_render("dossier-membre", "Dossier membre");

  const params = new URLSearchParams(location.search);
  const profileId = params.get("profile");
  const presetName = params.get("name") || "";

  const content = document.getElementById("content");
  content.innerHTML = `
    <div class="panel">
      <div class="panel-title"><h2>Rechercher / créer un dossier</h2></div>
      <form id="searchForm">
        <label>Nom du membre</label><input id="memberName" value="${presetName}" required>
        <div class="form-actions"><button class="btn-primary" type="submit">Ouvrir le dossier</button></div>
      </form>
    </div>
    <div id="fileArea"></div>
  `;

  let currentFileId = null;

  async function openFile(name) {
    let { data: file } = await sb.from("member_files").select("*").eq("member_name", name).maybeSingle();
    if (!file) {
      const { data: created, error } = await sb.from("member_files").insert({
        member_name: name, profile_id: profileId || null, created_by: LostMCAuth.profile.id,
      }).select().single();
      if (error) { alert(error.message); return; }
      file = created;
    }
    currentFileId = file.id;
    renderFile(name);
  }

  async function renderFile(name) {
    const area = document.getElementById("fileArea");
    area.innerHTML = `
      <div class="panel">
        <div class="panel-title"><h2>Dossier de ${name}</h2></div>
        <form id="entryForm">
          <div class="form-row">
            <div><label>Type</label><select id="entryType">
              <option value="note">Note</option>
              <option value="avertissement">Avertissement</option>
              <option value="sanction">Sanction</option>
              <option value="felicitation">Félicitation</option>
            </select></div>
          </div>
          <label>Détail</label><textarea id="entryContent" rows="3" required></textarea>
          <div class="form-actions"><button class="btn-primary" type="submit">Ajouter à la fiche</button></div>
        </form>
      </div>
      <div class="panel"><div class="panel-title"><h2>Historique</h2></div><div id="entries"><div class="empty">Chargement…</div></div></div>
    `;

    async function loadEntries() {
      const { data } = await sb.from("member_file_entries").select("*").eq("file_id", currentFileId).order("created_at", { ascending: false });
      const el = document.getElementById("entries");
      if (!data || !data.length) { el.innerHTML = `<div class="empty">Aucune entrée.</div>`; return; }
      el.innerHTML = data.map(e => `
        <div class="item-row">
          <div>
            <div class="t"><span class="tag">${e.entry_type}</span></div>
            <div class="d" style="white-space:pre-wrap">${e.content}</div>
            <div class="d">${e.author_name || ''} · ${new Date(e.created_at).toLocaleString('fr-FR')}</div>
          </div>
        </div>`).join("");
    }
    loadEntries();

    document.getElementById("entryForm").onsubmit = async (e) => {
      e.preventDefault();
      const { error } = await sb.from("member_file_entries").insert({
        file_id: currentFileId,
        entry_type: document.getElementById("entryType").value,
        content: document.getElementById("entryContent").value,
        author_id: LostMCAuth.profile.id, author_name: LostMCAuth.profile.username,
      });
      if (error) { alert(error.message); return; }
      e.target.reset(); loadEntries();
    };
  }

  document.getElementById("searchForm").onsubmit = (e) => {
    e.preventDefault();
    openFile(document.getElementById("memberName").value.trim());
  };

  if (presetName) openFile(presetName);
})();
</script>
</body>
</html>
