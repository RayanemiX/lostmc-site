<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dossier membre — The Lost MC</title>
<link rel="stylesheet" href="../../css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app"></div>
<script src="../../js/config.js"></script>
<script src="../../js/supabase-client.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/layout.js"></script>
<script>
(async () => {
  const result = await LostMCAuth.guardPage(["recruteur"]);
  if (!result) return;
  LostMCLayout_render("dossier-membre", "Dossier membre");

  const params = new URLSearchParams(location.search);
  const presetProfileId = params.get("profile");

  const content = document.getElementById("content");
  content.innerHTML = `
    <div class="panel">
      <div class="panel-title"><h2>Rechercher un dossier</h2></div>
      <form id="searchForm">
        <label>Membre</label><select id="memberSelect" required></select>
        <div class="form-actions"><button class="btn-primary" type="submit">Ouvrir le dossier</button></div>
      </form>
    </div>
  `;

  const { data: profiles } = await sb.from("profiles").select("*").order("codename");
  const sel = document.getElementById("memberSelect");
  sel.innerHTML = (profiles || []).map(p => `<option value="${p.id}">${p.codename || p.username}${p.member_code ? ' #' + p.member_code : ''}</option>`).join("");
  if (presetProfileId) sel.value = presetProfileId;

  document.getElementById("searchForm").onsubmit = (e) => {
    e.preventDefault();
    const p = profiles.find(x => x.id === sel.value);
    if (p) LostMC_openDossierModal(p);
  };

  if (presetProfileId) {
    const p = profiles.find(x => x.id === presetProfileId);
    if (p) LostMC_openDossierModal(p);
  }
})();
</script>
</body>
</html>
