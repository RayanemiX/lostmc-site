<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annonces — The Lost MC</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app"></div>
<script src="../js/config.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/layout.js"></script>
<script>
(async () => {
  const result = await LostMCAuth.guardPage();
  if (!result) return;
  LostMCLayout_render("annonces", "Annonces");

  const content = document.getElementById("content");
  content.innerHTML = `<div class="panel"><div class="panel-title"><h2>Fil d'annonces</h2><span class="meta">Site + Discord</span></div><div id="list"><div class="empty">Chargement…</div></div></div>`;

  async function load() {
    const { data } = await sb.from("announcements").select("*").order("pinned", { ascending: false }).order("created_at", { ascending: false });
    const el = document.getElementById("list");
    if (!data || !data.length) { el.innerHTML = `<div class="empty">Aucune annonce.</div>`; return; }
    el.innerHTML = data.map(a => `
      <div class="item-row">
        <div>
          <div class="t">${a.title} ${a.pinned ? '<span class="tag pinned">Épinglé</span>' : ''} <span class="tag">${a.source}</span></div>
          <div class="d" style="white-space:pre-wrap">${a.content}</div>
          <div class="d">${a.author_name || ''} · ${new Date(a.created_at).toLocaleString('fr-FR')}</div>
        </div>
      </div>`).join("");
  }
  load();
  sb.channel("annonces-realtime").on("postgres_changes", { event: "*", schema: "public", table: "announcements" }, load).subscribe();
})();
</script>
</body>
</html>
