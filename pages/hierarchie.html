<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hiérarchie — The Lost MC</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app"></div>
<script src="../js/config.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/layout.js"></script>
<script>
(async () => {
  const result = await LostMCAuth.guardPage();
  if (!result) return;
  LostMCLayout_render("hierarchie", "Hiérarchie");

  const content = document.getElementById("content");
  content.innerHTML = `<div class="panel"><div class="panel-title"><h2>Organigramme</h2><span class="meta">Synchronisé automatiquement depuis Discord</span></div><div id="list"><div class="empty">Chargement…</div></div></div>`;

  async function load() {
    const [{ data: grades }, { data: profiles }] = await Promise.all([
      sb.from("role_definitions").select("*").eq("is_hierarchy", true).order("grade_order"),
      sb.from("profiles").select("*"),
    ]);
    const el = document.getElementById("list");
    if (!grades || !grades.length) { el.innerHTML = `<div class="empty">Aucun grade configuré.</div>`; return; }

    el.innerHTML = grades.map(g => {
      const members = (profiles || []).filter(p => p.hierarchy_grade_key === g.key);
      return `
        <div class="item-row">
          <div style="width:100%">
            <div class="t" style="color:${g.color}">${g.label}${members.length ? ` — ${members.map(m => m.codename || m.username).join(', ')}` : ' — <span class="empty">vacant</span>'}</div>
            <div class="d">${g.duties || ''}</div>
          </div>
        </div>`;
    }).join("");
  }
  load();

  sb.channel("hierarchy-realtime")
    .on("postgres_changes", { event: "*", schema: "public", table: "profiles" }, load)
    .on("postgres_changes", { event: "*", schema: "public", table: "role_definitions" }, load)
    .subscribe();
})();
</script>
</body>
</html>
